name: DynamicIslandSim
options:
  bundleIdPrefix: com.islandsim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  DynamicIslandSim:
    type: application
    platform: iOS
    sources:
      - DynamicIslandSim
    info:
      path: DynamicIslandSim/Info.plist
      properties:
        CFBundleDisplayName: Island Sim
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
schemes:
  DynamicIslandSim:
    build:
      targets:
        DynamicIslandSim: all
    run:
      config: Debug

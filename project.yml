name: DynamicIslandSim
options:
  bundleIdPrefix: com.islandsim
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
targets:
  DynamicIslandSim:
    type: application
    platform: iOS
    sources:
      - path: DynamicIslandSim
    dependencies:
      - target: IslandWidget
        embed: true
    info:
      path: DynamicIslandSim/Info.plist
      properties:
        CFBundleDisplayName: Island Sim
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandsim.DynamicIslandSim
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  IslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: IslandWidget
      - path: DynamicIslandSim/Shared
    info:
      path: IslandWidget/Info.plist
      properties:
        CFBundleDisplayName: Island Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.islandsim.DynamicIslandSim.IslandWidget
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.9"
schemes:
  DynamicIslandSim:
    build:
      targets:
        DynamicIslandSim: all
    run:
      config: Debug
